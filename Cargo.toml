[package]
name = "experai"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.9" }
candle-nn = { version = "0.9" }
candle-transformers = { version = "0.9" }
tokenizers = "0.19"
hf-hub = "0.3"
safetensors = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
rand_distr = "0.4"
regex = "1"
csv = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
atrium-api = "0.25"
atrium-xrpc-client = { version = "0.5", features = ["reqwest"] }
sysinfo = "0.30"
